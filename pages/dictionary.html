<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary - Spoken English Course</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        /* Styles specific to the dictionary page */
        .alphabet-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-bottom: 1.5rem;
        }
        .alphabet-nav a {
            padding: 8px 12px;
            text-decoration: none;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            transition: background-color 0.3s, color 0.3s;
        }
        .alphabet-nav a:hover, .alphabet-nav a.active {
            background-color: var(--primary-color);
            color: white;
        }
        .dictionary-entry {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-left: 4px solid var(--primary-color);
            background-color: #f9f9f9;
        }
        .dictionary-entry h3 {
            margin-top: 0;
        }
        .dictionary-entry .pos {
            font-style: italic;
            color: #555;
        }
    </style>
</head>
<body data-page="dictionary">

    <header>
        <h1>Dictionary (నిఘంటువు)</h1>
    </header>

    <main class="container">
        <a href="../index.html" class="back-link">&larr; Back to Menu</a>

        <div id="dictionary-controls">
            <input type="search" id="dictionary-search" class="search-box" placeholder="Type to search for a word...">
            <nav class="alphabet-nav" id="alphabet-nav">
                <!-- Alphabet links will be generated by JS -->
            </nav>
        </div>

        <div id="dictionary-results">
            <p>Loading dictionary... please wait.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Spoken English Course</p>
    </footer>

    <script src="../js/common.js"></script>
</body>
</html>
